name: Daily CVE Processing and Release

on:
  schedule:
    - cron: '0 0 * * *' # Runs at midnight every day
  workflow_dispatch: # Allows for manual triggering of the workflow

permissions:
  contents: write

jobs:
  download-process-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download and process data
        run: |
          python sync.py

      - name: Set environment variables for date
        run: |
          echo "TAG_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
          echo "RELEASE_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag_name="nvd-web-cves-${{ env.TAG_DATE }}"
          # A manual run on a day that already has a release refreshes its assets instead of failing
          if gh release view "$tag_name" > /dev/null 2>&1; then
            echo "Release $tag_name already exists, its assets will be replaced"
          else
            # Created as a draft so that Wapiti, which reads the latest release, never sees it without its assets
            gh release create "$tag_name" --draft \
              --title "NVD Web CVEs ${{ env.RELEASE_DATE }}" \
              --notes "Automated daily release of processed CVE data." \
              --target "$GITHUB_SHA"
          fi

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag_name="nvd-web-cves-${{ env.TAG_DATE }}"
          echo "Tag name: $tag_name"
          gh release upload "$tag_name" releases/*.json.xz --clobber
          gh release edit "$tag_name" --draft=false --latest

      - name: Remove old releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_date=$(date +%s)
          gh release list --limit 100 --json tagName --jq '.[] | [.tagName] | @tsv' | while read -r tagName; do
            # Extract the date from the tagName
            release_date=$(echo $tagName | grep -oP '\d{8}')

            # Convert the extracted date into seconds
            release_date_seconds=$(date -d "$release_date" +%s 2>/dev/null)

            # If the date conversion was successful
            if [ $? -eq 0 ]; then
              release_age_days=$(( (current_date - release_date_seconds) / 86400 ))
              if [ $release_age_days -gt 30 ]; then
                echo "Deleting release $tagName (age: $release_age_days days)"
                gh release delete "$tagName" --yes
                # Delete the associated tag
                echo "Deleting tag $tagName"
                git push origin --delete $tagName || echo "Failed to delete tag $tagName"
              fi
            else
              echo "Failed to extract or parse the date for release $tagName"
            fi
          done

      # Last step on purpose: the release is published anyway, but the failed run sends a notification
      - name: Check that every software still gets new CVEs
        run: |
          if [ -s releases/stale_software.txt ]; then
            echo "No recent CVE for some software, their CPE name in the NVD may have changed (see sync.py):"
            while read -r line; do
              echo "::error title=Possibly stale CVE data::$line"
            done < releases/stale_software.txt
            exit 1
          fi
          echo "Every checked software got a CVE in the last year"
